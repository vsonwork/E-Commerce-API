# Quarkus Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=your_db_user
quarkus.datasource.password=your_db_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ecommerce_db
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# JWT Authentication
mp.jwt.verify.publickey.location=META-INF/publicKey.pem
mp.jwt.verify.issuer=ecommerce-app
quarkus.smallrye-jwt.sign.key-location=privateKey.pem
quarkus.smallrye-jwt.token.header=Authorization
quarkus.smallrye-jwt.token.cookie=
quarkus.smallrye-jwt.auth-mechanism=bearer

# Stripe Configuration
stripe.secret.key=sk_test_your_secret_key_here

# Quarkus HTTP Server
quarkus.http.port=8080